name: Apply Six Player Core Hardcode Fixups

on:
  push:
    branches:
      - agent/add-six-player-foundation
    paths:
      - scripts/fix-six-player-core-hardcodes.mjs
      - .github/workflows/apply-six-player-core-hardcodes-fix.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-six-player-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fix-six-player-core-hardcodes.mjs
      - name: Commit fixups
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: remove remaining four-player core hardcodes"
          git push origin HEAD:agent/add-six-player-foundation
