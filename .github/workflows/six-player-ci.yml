name: Six Player Integrated CI

on:
  push:
    branches:
      - agent/add-six-player-foundation
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Rollup Linux native binary
        working-directory: frontend
        run: npm install --no-save @rollup/rollup-linux-x64-gnu
      - name: Test six-player board topology
        working-directory: frontend
        run: npm run test:six-player
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Check backend syntax
        run: node --check backend/server.cjs
      - name: Verify integrated assets
        run: |
          test -f frontend/dist/game.html
          test -f frontend/dist/index.html
          test -n "$(find frontend/dist/assets -type f -name '*.js' -exec grep -l 'classic6' {} + | head -n 1)"
          test -n "$(find frontend/dist/assets -type f -name '*.js' -exec grep -l 'player-6' {} + | head -n 1)"
