name: Apply Six Player Review Fix

on:
  push:
    branches:
      - agent/add-six-player-foundation
    paths:
      - .github/workflows/fix-six-player-review.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore four-piece limit and remove this workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/server.cjs')
          text = path.read_text(encoding='utf-8')
          old = "if (![1, 2, 3, 4, 5, 6].includes(pieceCount)) throw new Error('无效的棋子数量');"
          new = "if (![1, 2, 3, 4].includes(pieceCount)) throw new Error('无效的棋子数量');"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one piece-count expansion, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/fix-six-player-review.yml
      - name: Commit review fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.cjs .github/workflows/fix-six-player-review.yml
          git commit -m "fix: keep per-player piece count capped at four"
          git push origin HEAD:agent/add-six-player-foundation
