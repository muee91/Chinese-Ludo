name: Apply Six Player Refactor

on:
  push:
    branches:
      - agent/add-six-player-foundation
    paths:
      - scripts/apply-six-player-refactor.mjs
      - .github/workflows/apply-six-player-refactor.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-six-player-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source migration
        run: node scripts/apply-six-player-refactor.mjs
      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "feat: integrate six-player mode into original engine"
          git push origin HEAD:agent/add-six-player-foundation
