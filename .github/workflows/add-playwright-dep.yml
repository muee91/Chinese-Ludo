name: Add Playwright Frontend Dependency

on:
  push:
    branches:
      - agent/add-six-player-foundation

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-six-player-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add Playwright to frontend package and lockfile
        working-directory: frontend
        run: npm install --save-dev --workspaces=false playwright@1.54.2
      - name: Commit dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test: add Playwright visual smoke dependency"
          git push origin HEAD:agent/add-six-player-foundation
